schema: spec-driven

# Project context
# Restricciones que guían los artefactos y que un agente no puede inferir leyendo el código.
# Fuente: knowledge-base/ (decisiones del autor del 2026-10-02 al 2026-10-28; registro en
# knowledge-base/10_preguntas_abiertas.md, D1..D331). Actualizado el 2026-10-15, tras archivar C-06: lo que
# era propio del primer change pasó a sus artefactos archivados y aquí queda lo que vale para todos.
context: |
  Proyecto: sistema de turnos y agenda para consultorios odontológicos (Argentina). Trabajo universitario.
  Todos los artefactos (proposal, specs, design, tasks) se escriben en español.
  Stack: Python 3.11+, SQLAlchemy de la serie 2.0.x (no la 2.1) SINCRÓNICO, FastAPI de la serie 0.115.x,
  Pydantic compatible con ese FastAPI, pytest. No se usan aiosqlite ni pytest-asyncio.
  Estructura: código en backend/app y tests en backend/tests; el archivo único de dependencias es
  backend/pyproject.toml (dependencias de ejecución, de test y configuración de pytest; sin requirements.txt
  ni pytest.ini, y sin empaquetado) y el README.md va en la raíz, indicando desde qué directorio se instala
  y se corre pytest. Toda
  mención de app/domain significa backend/app/domain. Zonas horarias en Windows: el paquete de datos de zonas
  (tzdata) se declara en el archivo único y se menciona en el README; el dominio importa solo la biblioteca
  estándar (zoneinfo lo es).
  Las versiones exactas se fijan con pins en el design del change; no inventar números. Política de pins
  (D133): ninguna versión publicada en la semana anterior al día del design, para ningún paquete; si la más
  nueva es tan reciente, la más nueva anterior dentro de la serie permitida. Cada pin lleva versión, fecha de
  publicación, fuente y fecha de consulta; la compatibilidad se comprueba con los metadatos, no se supone.
  Tests: SQLite en memoria (sqlite+pysqlite:///:memory:, StaticPool), engine por test, sin mocks de sesión
  ni de repositorio. El dominio se testea sin base de datos. El repo debe poder clonarse y correr los tests
  solo con el README, sin Docker, PostgreSQL ni Redis. La prueba de reservas simultáneas (E11) queda fuera
  de la suite por defecto: corre en un perfil opcional con PostgreSQL, documentado en el README.
  Reglas de agenda: funciones puras de dominio. Intervalos semiabiertos [inicio, fin): un turno que empieza
  justo cuando termina otro es válido. Fechas siempre aware en UTC; el reloj es un único utc_now() inyectable.
  Una fecha sin zona o con desfase distinto de UTC se rechaza con el código RN-GL-01 (422).
  Única excepción al trabajo en UTC: un turno no puede cruzar la medianoche DEL CONSULTORIO (RN-AG-10d);
  esa regla convierte inicio y fin a Consultorio.zona_horaria, que Intervalo recibe como dato.
  Estados activos (ocupan horario): pendiente_aprobacion, pendiente_sena, reservado, confirmado. Desde que
  exista la seña cuenta el estado efectivo evaluado al consultar (RN-GL-05); antes de la seña no aplica.
  Fuera de la v1: sobreturnos y excepción de horario. El paciente no tiene cuenta (gestiona su turno con token).
  El autor implementa el proyecto change por change, en el orden de CHANGES.md (índice, dependencias y
  estado de cada uno). Lo que fijó cada change archivado está en openspec/specs/ y en su design dentro de
  openspec/changes/archive/; este contexto no lo repite.
  Infraestructura (desde C-02): PostgreSQL 17.10 con psycopg 3 y migraciones Alembic (los tests por defecto
  siguen con create_all sobre SQLite); Docker Compose publica PostgreSQL en 127.0.0.1:5434 y la API en
  127.0.0.1:8000. Lo que solo PostgreSQL garantiza se prueba en el perfil opcional `postgres`.
  Sesión (desde C-06): JWT HS256 de acceso y de renovación y hash bcrypt; desde C-07 las rutas del panel exigen el access token y el rol (D204; capability proteccion-del-panel).
  Cada change mantiene la demo sin Docker (SQLite en memoria, datos ficticios cargados al arrancar, con
  identificadores fijos documentados en el README). Las fases 1 y 2 son solo API y se prueban desde
  Swagger (/docs); la interfaz (React + TypeScript + Vite) empieza en la fase 3.
  Frontend (desde C-08): `frontend/` con React, TypeScript y Vite; su archivo de dependencias es `frontend/package.json`
  con su `package-lock.json` (versiones exactas, D217), con Node 24 LTS. Su suite por defecto es `npm test` (Vitest con un
  servidor falso de la API inyectado, sin `vi.mock`), que corre sin Docker ni Python. El servicio `frontend` de Compose
  publica en 127.0.0.1:5173 y la interfaz llama a la API por el mismo origen (`/api`).
  Agente: la skill propia revisor-de-escenarios (.claude/skills/) revisa spec y tasks contra la KB después del propose y antes del apply; solo informa, no edita.
  El MCP de Stitch (.mcp.json, key en STITCH_API_KEY) da diseños de pantalla como referencia visual en changes con interfaz; la KB y la spec mandan y solo se le envían textos ficticios.
  Desde D234 (2026-10-19), toda pantalla del frontend se implementa a partir de una pantalla generada en Stitch con el design system del proyecto ("Clinical Ops"), no solo de sus tokens.
  WhatsApp en la v1 = enlace wa.me (Cloud API en Fase 2).
  Todo rechazo lleva el código RN (p. ej. RN-AG-05, RN-AG-08, RN-GL-04). Hay dos clases (RN-GL-02, D135), precedidas desde C-07 por el control de acceso: 401 sin sesión y 403 con rol insuficiente, antes de la validación (D208).
  VALIDACIÓN DE ENTRADA (referencias inválidas, RN-GL-04; fecha sin zona o con desfase distinto de UTC,
  RN-GL-01; cuerpo mal formado): todos los problemas de la petición se informan JUNTOS en un único 422, con
  todos los códigos; lo que no se puede evaluar porque otro dato es inválido no se informa. REGLA DE NEGOCIO
  (la petición está bien formada pero la agenda no la admite): se evalúa solo con la entrada válida y DE A
  UNA; la primera que falla es la única que se informa. El solapamiento es UNA regla que mira dos recursos:
  el doble conflicto (E4) informa RN-AG-05 y RN-AG-08 en un mismo 409 (lectura confirmada por el autor, D139).
  Orden al crear un turno: validación de entrada, RN-AG-10d, solapamiento; un change que agregue reglas
  fija en su design dónde entran en ese orden.
  Un recurso inexistente o inactivo referido en el CUERPO de la petición devuelve 422 (RN-GL-04); uno
  identificado en la URL devuelve 404. Un paciente solo puede ser inexistente: el paciente inactivo no existe
  en la v1 (Fase 2, D136); prestación, profesional y sillón sí pueden estar inactivos.
  RN-GL-04 lista TODAS las referencias inválidas de la petición, no solo la primera. Si no se indica el sillón
  o el profesional se usa el único activo del consultorio; si no hay uno solo, se rechaza con RN-GL-04
  (RN-AG-14). El consultorio del turno sale del profesional (v1: un profesional pertenece a un consultorio);
  una referencia de otro consultorio cuenta como inexistente. Si el candidato choca con varios turnos de un
  recurso, el Conflicto lleva el que empieza primero.
  La suite conserva el test de ida y vuelta de zonas horarias con SQLite (escribir aware UTC, leer aware
  UTC) y el que falla si backend/app/domain importa un módulo prohibido.
  Datos de pacientes siempre ficticios. Nunca versionar secretos ni .env.

# Per-artifact rules
rules:
  proposal:
    - Incluir una sección "Fuera de alcance" que liste explícitamente lo que el change no hace.
    - Citar las historias (US-NNN) y los escenarios (E#) que cubre y los que deja fuera.
    - "Mantener el change chico: una sola capability."
    - Si el change se aparta de los 3 a 6 escenarios o de las alrededor de 20 tareas de CHANGES.md, dejar asentada la excepción con la decisión que la respalda (como D123 y D134 en el primer change).
  specs:
    - Escribir cada Requirement con SHALL y citar las reglas de negocio (RN-XX-NN) que implementa.
    - Escribir cada Scenario en formato WHEN/THEN, con el ID de escenario (E#) en el título.
    - Incluir al menos un escenario feliz, uno de error de negocio y uno de borde.
    - Los horarios de los ejemplos se expresan en UTC.
  design:
    - Incluir una sección "Non-goals" (qué no se resuelve en este change).
    - Fijar las versiones exactas de las dependencias (pins) en el archivo de dependencias de su subproyecto (backend/pyproject.toml para la API; frontend/package.json con su package-lock.json para la interfaz desde C-08), cada una con su fecha de publicación y su fuente, sin versiones publicadas en la última semana.
    - Clasificar cada rechazo como validación de entrada o como regla de negocio (RN-GL-02) y fijar el orden de evaluación.
    - Marcar cada elección no confirmada por el autor como "Propuesta".
    - Marcar cada comprobación técnica pendiente como "A verificar en el change", indicando antes de qué se verifica.
    - "En un change con interfaz (D234), la sección \"Referencia visual (Stitch)\" cita el id de la pantalla generada en Stitch (projects/.../screens/...) y sus archivos de evidencia (captura y HTML), lista las decisiones visuales que toma de ella y las que rechaza con su motivo (la KB y la spec mandan sobre el contenido), y fija que el HTML de Stitch se traduce a los tokens CSS del proyecto sin dependencias nuevas (ni Tailwind ni fuentes o íconos por CDN). Sin la pantalla, el change de interfaz no se cierra."
  tasks:
    - Ordenar las tareas por escenario en el ciclo RED, GREEN, TRIANGULATE, REFACTOR; el test que falla va antes que el código.
    - Cada tarea de test cita el escenario (E#) y la regla (RN) que verifica.
    - No agrupar los tests al final ni incluir tareas de "leer archivos" como tareas.
    - Agrupar las tareas por tema (preparación, dominio, persistencia, un grupo por escenario, API, demo y README, verificación final).
    - Incluir una tarea final de verificación en clon limpio siguiendo solo el README.
    - "Incluir una tarea en que el agente levanta la API y prueba en /docs (o en la interfaz, desde la fase 3) los endpoints del change, con la respuesta de éxito y los rechazos con su código RN, y le deja al autor el paso a paso. La repetición a mano del autor es opcional: va como tarea solo si el change es complejo, crítico o esencial, o si el agente no quedó conforme con lo que pudo probar."
    - "En un change con interfaz (D234), la prueba en el navegador compara la implementación con la captura de la pantalla de Stitch citada en el design y anota las diferencias que queden."

# Per-operation guidance
operations:
  apply:
    guidance:
      - "TDD estricto: no escribir código de producción sin un test que falle antes."
      - No usar mocks de sesión ni de repositorio.
  archive:
    guidance:
      - Antes de archivar, correr los tests y verificar que no quedan archivos de bloqueo residuales.
      - Al archivar, marcar el change con [x] en CHANGES.md y repetir la verificación cruzada con scripts/verificar_changes.py.
