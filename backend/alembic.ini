# Configuración de Alembic (design I3, I6). No lleva URL ni credenciales:
# env.py toma la de DATABASE_URL (o la opción sqlalchemy.url si un programa la define).
[alembic]
script_location = %(here)s/app/infrastructure/db/migraciones
prepend_sys_path = .
path_separator = os
# Revisiones cortas y legibles (0001, 0002...) en lugar del hash por defecto.
file_template = %%(rev)s_%%(slug)s

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
